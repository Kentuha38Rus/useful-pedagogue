user  nginx;
worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    # Docker-овский встроенный DNS. Благодаря resolver + proxy_pass с переменной
    # (см. conf.d/default.conf) имена контейнеров определяются во время запроса,
    # а не один раз при старте nginx. Иначе после пересборки контейнеров
    # frontend/admin-panel/backend nginx продолжает ходить на их старые IP,
    # и домены могут начать отдавать чужое приложение.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
}
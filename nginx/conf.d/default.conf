# ============================================================
#  HTTP → HTTPS редирект + ACME challenge
# ============================================================
server {
    listen 80;
    listen [::]:80;
    server_name juurnal.ru www.juurnal.ru admin.juurnal.ru app.juurnal.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================
#  juurnal.ru + www.juurnal.ru → landing
# ============================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name juurnal.ru www.juurnal.ru;

    ssl_certificate     /etc/nginx/certs/live/juurnal.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/juurnal.ru/privkey.pem;
    ssl_trusted_certificate /etc/nginx/certs/live/juurnal.ru/chain.pem;
    include snippets/ssl-params.conf;
    include snippets/security-headers.conf;

    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self' wss://juurnal.ru; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://landing:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /socket.io/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

